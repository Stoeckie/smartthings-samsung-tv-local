name: samsung-tv
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: audioVolume
        version: 1
      - id: audioMute
        version: 1
      - id: mediaInputSource
        version: 1
      - id: tvChannel
        version: 1
      - id: keypadInput
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Television
preferences:
  - name: ipAddress
    title: TV IP address
    description: Leave on "auto" (found on the network). Set an IP only if that fails; a fixed IP in the router helps.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: macAddress
    title: TV MAC address (wake-on-LAN)
    description: Leave on "auto" (read from the TV). For a TV on cable, enter the MAC of its wired port.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: pollInterval
    title: Poll interval (seconds)
    required: false
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 300
      default: 10
  - name: soundOutput
    title: Sound output
    description: Choose "Soundbar or receiver" when the sound goes over HDMI ARC/eARC; volume and mute then go as remote control keys (the TV passes them on). The volume shown is then counted from the last value set.
    required: false
    preferenceType: enumeration
    definition:
      options:
        tv: TV speakers
        external: Soundbar or receiver
      default: tv
  - name: inputMethod
    title: Input switching
    description: '"Direct keys" sends HDMI1..4 / TV keys (older TVs). Newer TVs (2021 and later) ignore those; "Source menu" opens the Source menu and picks the tile at the position set below.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        direct: Direct keys
        menu: Source menu
      default: direct
  - name: menuPositions
    title: Source menu positions
    description: Tile number of each input in the Source menu, counting left to right, top to bottom (1 = top left).
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "digitalTv=1,HDMI1=3,HDMI2=4,HDMI3=5,HDMI4=6"
  - name: menuColumns
    title: Source menu columns
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 8
      default: 2
