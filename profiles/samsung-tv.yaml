name: samsung-tv
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: audioVolume
        version: 1
      - id: audioMute
        version: 1
      - id: tvChannel
        version: 1
      - id: keypadInput
        version: 1
      - id: silvervalley08660.tvInput
        version: 1
      - id: mediaInputSource
        version: 1
      - id: silvervalley08660.tvSourceMenu
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Television
preferences:
  - name: ipAddress
    title: TV IP address
    description: Leave on "auto" (found on the network). Set an IP only if that fails; a fixed IP in the router helps.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: macAddress
    title: TV MAC address (wake-on-LAN)
    description: Leave on "auto" (read from the TV). For a TV on cable, enter the MAC of its wired port.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: pollInterval
    title: Poll interval (seconds)
    required: false
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 300
      default: 10
  - name: soundOutput
    title: Sound output
    description: Choose "Soundbar or receiver" when the sound goes over HDMI ARC/eARC; volume and mute then go as remote control keys (the TV passes them on). The volume shown is then counted from the last value set.
    required: false
    preferenceType: enumeration
    definition:
      options:
        tv: TV speakers
        external: Soundbar or receiver
      default: tv
  - name: sources
    title: Sources
    description: 'Your sources by name, with their tile number in the Source menu (left to right, top to bottom) or a key sequence, e.g. "Tv=1,PC=3,Sonos Beam=5" or "PC=KEY_HDMI1". "auto": TV and HDMI 1 to 4 (Source menu for TVs from 2021 on, direct keys for older ones).'
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: menuColumns
    title: Source menu columns
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 8
      default: 2
